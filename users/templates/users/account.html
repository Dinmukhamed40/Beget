{% extends 'users/base.html' %} {% block title %}Личный кабинет ГЕРОЯ | GamerVerse{% endblock %}

{% block content %}
<style>
    /* Оставляем твои уникальные стили карточки, они будут работать только на этой странице */
    .profile-wrapper {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 50px 20px;
        min-height: calc(100vh - 80px);
    }

    .profile-card {
        background: #202020;
        padding: 30px;
        border-radius: 15px;
        border-top: 5px solid #e62429;
        text-align: center;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .avatar-circle {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #e62429;
        margin-bottom: 15px;
    }

    .hero-input-group {
        text-align: left;
        margin-bottom: 15px;
    }

    .hero-input-group label {
        display: block;
        color: #e62429;
        font-size: 11px;
        font-weight: bold;
        margin-bottom: 5px;
        letter-spacing: 1px;
    }

    .hero-input-group input {
        width: 100%;
        padding: 12px;
        background: #111;
        border: 1px solid #333;
        color: white;
        border-radius: 5px;
        font-family: inherit;
    }

    .btn-update {
        background: #e62429;
        color: white;
        border: none;
        padding: 15px;
        width: 100%;
        font-weight: bold;
        cursor: pointer;
        border-radius: 5px;
        margin-top: 10px;
        transition: 0.3s;
        text-transform: uppercase;
    }

    .btn-update:hover {
        background: #ff2b31;
        transform: translateY(-2px);
    }

    .logout-container {
        margin-top: 20px;
        border-top: 1px solid #333;
        padding-top: 20px;
    }
</style>

<div class="profile-wrapper">
    <div class="profile-card">
        <h1 style="font-size: 20px; margin-bottom: 20px;">ЛИЧНЫЙ КАБИНЕТ ГЕРОЯ</h1>

        <img src="{{ user.profile.image.url }}" class="avatar-circle">

        <p style="color: #888; font-size: 12px; margin-bottom: 20px;">ID: HERO-{{ user.id }}</p>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="hero-input-group">
                <label>ПОЗЫВНОЙ (USERNAME):</label>
                {{ u_form.username }}
            </div>

            <div class="hero-input-group">
                <label>КАНАЛ СВЯЗИ (EMAIL):</label>
                {{ u_form.email }}
            </div>

            <div class="hero-input-group">
                <label>БИОМЕТРИЧЕСКИЙ СНИМОК (АВАТАР):</label>
                {{ p_form.image }}
            </div>

            <button type="submit" class="btn-update">СОХРАНИТЬ ИЗМЕНЕНИЯ</button>
        </form>

        <div class="logout-container">
             <a href="{% url 'home' %}" style="color: #aaa; font-size: 11px; text-decoration: none;">← Вернуться на главную базу</a>
        </div>
    </div>
</div>
{% endblock %}
